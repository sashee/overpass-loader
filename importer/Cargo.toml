[package]
name = "overpass-import"
version = "0.1.0"
description = "Imports an OSM PBF file into a fresh Overpass API database, byte-equivalent to upstream update_database"
edition = "2021"
license = "AGPL-3.0-or-later"

[dependencies]
# Blob decompression; any correct inflate will do.
flate2 = "1"
# Block compression must match upstream byte for byte: lz4-sys builds the C
# liblz4 1.10.0, the version upstream links.
lz4 = "1.28"

# A workspace of its own, so that changing the importer does not change the
# sources of the corpus tools and rebuild every reference database.
[workspace]
